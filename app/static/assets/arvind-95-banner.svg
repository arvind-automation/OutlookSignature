<svg xmlns="http://www.w3.org/2000/svg" width="600" height="110" viewBox="0 0 600 110" role="img" aria-label="95 Years of Legacy">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B1538"/>
      <stop offset="45%" stop-color="#8B1538"/>
      <stop offset="100%" stop-color="#6f6670"/>
    </linearGradient>
    <pattern id="factoryPattern" patternUnits="userSpaceOnUse" width="120" height="110">
      <rect width="120" height="110" fill="#7a7078"/>
      <rect x="10" y="58" width="18" height="34" fill="#5f5860"/>
      <rect x="34" y="48" width="22" height="44" fill="#6a636b"/>
      <rect x="62" y="54" width="16" height="38" fill="#5f5860"/>
      <rect x="84" y="42" width="20" height="50" fill="#6a636b"/>
      <rect x="0" y="88" width="120" height="22" fill="#4f4a52"/>
    </pattern>
    <mask id="fadeMask">
      <rect width="600" height="110" fill="url(#bannerGradient)"/>
    </mask>
  </defs>

  <rect width="600" height="110" fill="url(#bannerGradient)"/>
  <rect x="250" y="0" width="350" height="110" fill="url(#factoryPattern)" opacity="0.45"/>

  <text x="58" y="58" fill="#ffffff" font-family="Georgia, serif" font-size="54" font-weight="700">95</text>
  <text x="58" y="78" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.5">YEARS</text>

  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="11">
    <text x="130" y="34">of Reinvention</text>
    <text x="130" y="50">of Crafting Possibilities</text>
    <text x="130" y="66">of Responsible Growth</text>
    <text x="130" y="82">of Shaping Tomorrow</text>
    <text x="130" y="98">of Legacy</text>
  </g>

  <text x="520" y="58" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-style="italic" font-weight="700">Arvind</text>
  <text x="520" y="74" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="6.5" letter-spacing="1.8">FASHIONING POSSIBILITIES</text>
</svg>
