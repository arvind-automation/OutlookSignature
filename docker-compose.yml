services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digitalsignature_arvind}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  init-db:
    build: .
    command: ["python", "init_db.py"]
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-rootpass}@db:3306/${MYSQL_DATABASE:-digitalsignature_arvind}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      FLASK_ENV: ${FLASK_ENV:-development}
      INIT_DB_STRICT_ASSETS: ${INIT_DB_STRICT_ASSETS:-0}
      INIT_DB_ALLOW_RESET: ${INIT_DB_ALLOW_RESET:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-rootpass}@db:3306/${MYSQL_DATABASE:-digitalsignature_arvind}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      FLASK_ENV: ${FLASK_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-}
    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  mysql_data:
